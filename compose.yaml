services:

  postgres:
    image: postgres:18.4
    container_name: commerce-postgres

    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce

    ports:
      - "5432:5432"

    volumes:
      - commerce-postgres-data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: commerce-redis
    ports:
      - "6379:6379"
    volumes:
      - commerce-redis-data:/data

volumes:
  commerce-postgres-data:
  commerce-redis-data: