services:

  postgres:
    image: postgres:18.4

    environment:
      POSTGRES_DB: ${POSTGRES_NAME:-commerce-dev}
      POSTGRES_USER: ${POSTGRES_USERNAME:-commerce-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - commerce-postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - commerce-redis-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  commerce-api:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      # Spring configuration
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Deployment identity for logs and metrics
      APP_DEPLOYMENT_ENVIRONMENT: ${APP_DEPLOYMENT_ENVIRONMENT:-local}

      # PostgreSQL (internal Docker networking)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_NAME: ${POSTGRES_NAME:-commerce-dev}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-commerce-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is Required}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}

      # HikariCP
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-20}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-5}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-30000}
      DB_VALIDATION_TIMEOUT_MS: ${DB_VALIDATION_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-600000}
      DB_MAX_LIFETIME_MS: ${DB_MAX_LIFETIME_MS:-1800000}

      # Redis (internal Docker networking)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-2s}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-2s}

      # Spring Boot
      SPRING_SERVER_PORT: ${SPRING_SERVER_PORT:-8080}

      # Security
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

      # Optional development admin
      DEV_ADMIN_ENABLED: ${DEV_ADMIN_ENABLED:-false}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@example.com}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}

      # Fake payment behavior
      FAKE_PAYMENT_OUTCOME: ${FAKE_PAYMENT_OUTCOME:-SUCCESS}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

#      JAVA_TOOL_OPTIONS: >-
#        -XX:MaxRAMPercentage=75.0

    ports:
      - "8080:${SPRING_SERVER_PORT:-8080}"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

#    healthcheck:
#      test:
#        [
#          "CMD-SHELL",
#          "wget -q -O - http://localhost:8080/livez > /dev/null || exit 1"
#        ]
#      interval: 10s
#      timeout: 5s
#      retries: 10
#      start_period: 30s

volumes:
  commerce-postgres-data:
  commerce-redis-data: