spring:

  application:
    name: commerce-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commerce}
    username: ${DB_USERNAME:commerce}
    password: ${DB_PASSWORD:commerce}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

    cache:
      type: redis
      cache-names:
        - reviewSummaries
#      redis:
#        time-to-live: 10m

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
        add-additional-paths: true

  health:
    redis:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENVIRONMENT:local}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

  structured:
    format:
      console: ecs

    ecs:
      service:
        environment: ${APP_ENVIRONMENT:local}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: commerce-api
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}

payment:
  fake:
    outcome: ${FAKE_PAYMENT_OUTCOME:SUCCESS}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

  show-actuator: false