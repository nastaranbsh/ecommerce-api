spring:
  application:
    name: commerce-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_NAME:commerce-dev}?sslmode=${POSTGRES_SSL_MODE:disable}
    username: ${POSTGRES_USERNAME:commerce-dev}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}

  cache:
    type: redis
    cache-names:
      - reviewSummaries
#      redis:
#        time-to-live: 10m

server:
  port: ${SPRING_SERVER_PORT:8080}

app:
  dev-admin:
    enabled: ${DEV_ADMIN_ENABLED:false}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${spring.application.name}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
        add-additional-paths: true

  health:
    redis:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${APP_DEPLOYMENT_ENVIRONMENT:local}

logging:
  level:
    root: INFO
    com.nbsh.commerceapi: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
    org.hibernate.orm.jdbc.bind: WARN

  structured:
    format:
      console: ecs

    ecs:
      service:
        environment: ${APP_DEPLOYMENT_ENVIRONMENT:local}

