spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s


server:
  forward-headers-strategy: framework


app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}


payment:
  fake:
    outcome: ${FAKE_PAYMENT_OUTCOME:SUCCESS}


springdoc:
  swagger-ui:
    enabled: true

  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus

  endpoint:
    health:
      show-details: never

      group:
        readiness:
          include:
            - readinessState
            - db